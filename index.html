<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Audius Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    :root {
      --theme-color: #1DB954;
      --theme-color-glow: rgba(29, 185, 84, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212 !important;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%) !important;
      color: #ffffff !important;
      min-height: 100vh; padding: 20px 16px; overflow-x: hidden;
      display: flex; justify-content: center;
    }
    
    .app { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
    .header h1 { font-size: 24px; font-weight: 800; color: #ffffff; }
    .header p { font-size: 14px; color: #b3b3b3; margin-top: 6px; font-weight: 500; }

    .cover {
      width: 100%; aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, var(--theme-color) 0%, #111 100%);
      border-radius: 24px; display: flex; align-items: center; justify-content: center;
      font-size: 90px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px var(--theme-color-glow);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.8s ease, box-shadow 0.8s ease; 
      user-select: none;
      overflow: hidden;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; }
    .cover.playing { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 
      0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px var(--theme-color-glow); } 
      50% { transform: scale(1.02); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 80px var(--theme-color); } 
    }

    .track-info { text-align: center; margin-top: 8px; }
    .track-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { font-size: 14px; color: #a7a7a7; font-weight: 500; }

    .player-panel {
      background: rgba(255, 255, 255, 0.06) !important; 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 18px;
    }

    .progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .progress-wrap input[type="range"] {
      width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.2);
      outline: none; cursor: pointer; accent-color: var(--theme-color); -webkit-appearance: none; appearance: none;
    }
    .progress-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #ffffff; cursor: pointer; box-shadow: 0 0 10px var(--theme-color-glow);
    }
    .time { display: flex; justify-content: space-between; font-size: 12px; color: #a7a7a7; font-weight: 500; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 32px; margin-top: 4px; }
    .ctrl { background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; transition: transform 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
    .ctrl:active { transform: scale(0.85); }
    .ctrl.play {
      width: 64px; height: 64px; border-radius: 50%; background: var(--theme-color); color: #000; font-size: 28px;
      box-shadow: 0 8px 24px var(--theme-color-glow); 
      transition: transform 0.2s, box-shadow 0.2s, background 0.8s, box-shadow 0.8s;
    }
    .ctrl.play:active { transform: scale(0.95); }

    .search-bar { width: 100%; position: relative; margin-bottom: 10px; }
    .search-bar input {
      width: 100%; padding: 12px 16px 12px 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255, 255, 255, 0.08); color: #ffffff; font-size: 15px; outline: none;
    }
    .search-bar input::placeholder { color: #888; }
    .search-bar::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.6;
    }

    .playlist h3 { font-size: 13px; font-weight: 700; color: #a7a7a7; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; padding-left: 4px; }
    .playlist ul { list-style: none; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
    
    .playlist li {
      padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent; cursor: pointer; font-size: 15px; font-weight: 500; color: #e5e5e5;
      transition: all 0.25s ease; display: flex; align-items: center; justify-content: space-between;
    }
    .playlist li .track-main { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .playlist li .track-main::before { content: "♪"; font-size: 16px; color: #a7a7a7; }
    .playlist li:active { transform: scale(0.98); }
    .playlist li.active { 
      background: rgba(255, 255, 255, 0.1); 
      border: 1px solid var(--theme-color); 
      color: var(--theme-color); 
      font-weight: 600; 
      box-shadow: 0 4px 15px var(--theme-color-glow);
    }
    .playlist li.active .track-main::before { content: "▶"; color: var(--theme-color); font-size: 14px; }

    .loader { text-align: center; padding: 20px; color: #a7a7a7; font-size: 14px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Audius Player</h1>
      <p id="user-name">Привет!</p>
    </header>

    <div class="cover" id="cover">🎶</div>

    <div class="track-info">
      <h2 id="track-title">Выбери трек</h2>
      <p id="track-artist">—</p>
    </div>

    <div class="player-panel">
      <div class="progress-wrap">
        <input type="range" id="progress" value="0" min="0" max="100" step="0.1" />
        <div class="time"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
      </div>
      <div class="controls">
        <button id="prev" class="ctrl">⏮</button>
        <button id="play" class="ctrl play">▶</button>
        <button id="next" class="ctrl">⏭</button>
      </div>
    </div>

    <div>
      <div class="search-bar">
        <input type="text" id="search" placeholder="Поиск в Audius (например, lofi)..." />
      </div>
    </div>

    <div class="playlist">
      <ul id="playlist"><li class="loader">Загрузка популярных треков...</li></ul>
    </div>
  </div>

  <audio id="audio" crossorigin="anonymous"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) { document.getElementById('user-name').textContent = 'С возвращением, ' + user.first_name + '!'; }
    }

    // Используем публичный API Audius (не требует ключей)
    const AUDIUS_API = 'https://discoveryprovider.audius.co/v1';
    
    let tracks = [];
    let currentIndex = -1;
    let searchTimeout;

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const cover = document.getElementById('cover');
    const playlistEl = document.getElementById('playlist');
    const searchInput = document.getElementById('search');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    function updateTheme(color) {
      document.documentElement.style.setProperty('--theme-color', color);
      const hex = color.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      document.documentElement.style.setProperty('--theme-color-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
    }

    // Загрузка треков из Audius
    async function fetchTracks(query = '') {
      playlistEl.innerHTML = '<li class="loader">Поиск...</li>';
      try {
        let url = `${AUDIUS_API}/tracks/trending?app_name=TGPlayer`;
        if (query) {
          url = `${AUDIUS_API}/tracks/search?query=${encodeURIComponent(query)}&app_name=TGPlayer`;
        }
        
        const response = await fetch(url);
        const data = await response.json();
        
        if (data.data && data.data.length > 0) {
          tracks = data.data.slice(0, 15); // Берем первые 15 результатов
          renderPlaylist();
        } else {
          playlistEl.innerHTML = '<li class="loader">Ничего не найдено</li>';
        }
      } catch (error) {
        console.error('Ошибка поиска:', error);
        playlistEl.innerHTML = '<li class="loader">Ошибка загрузки. Попробуй позже.</li>';
      }
    }

    function loadTrack(index) {
      if (index < 0 || index >= tracks.length) return;
      currentIndex = index;
      const track = tracks[index];
      
      // Audius отдает прямую ссылку на поток
      audio.src = track.stream_url || `https://discoveryprovider.audius.co/v1/tracks/${track.id}/stream?app_name=TGPlayer`;
      
      document.getElementById('track-title').textContent = track.title;
      document.getElementById('track-artist').textContent = track.user.name;
      
      // Устанавливаем обложку, если есть
      if (track.artwork && track.artwork['480x480']) {
        cover.innerHTML = `<img src="${track.artwork['480x480']}" alt="cover">`;
      } else {
        cover.innerHTML = '🎶';
      }

      // Генерируем цвет на основе ID трека для разнообразия
      const colors = ['#1DB954', '#E32636', '#1E90FF', '#8A2BE2', '#FF8C00', '#00CED1'];
      const color = colors[track.id % colors.length];
      updateTheme(color);
      
      renderPlaylist();
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      if (tracks.length === 0) {
        playlistEl.innerHTML = '<li class="loader">Введи запрос для поиска</li>';
        return;
      }

      tracks.forEach((track, index) => {
        const li = document.createElement('li');
        const isActive = currentIndex === index;
        if (isActive) li.classList.add('active');

        const mainDiv = document.createElement('div');
        mainDiv.className = 'track-main';
        mainDiv.innerHTML = `<span>${track.title} — ${track.user.name}</span>`;

        li.appendChild(mainDiv);

        li.addEventListener('click', () => {
          loadTrack(index);
          audio.play();
        });

        playlistEl.appendChild(li);
      });
    }

    // Обработчик поиска с задержкой (чтобы не спамить API)
    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        fetchTracks(e.target.value.trim());
      }, 800);
    });

    playBtn.addEventListener('click', () => {
      if (audio.paused) audio.play(); else audio.pause();
    });

    audio.addEventListener('play', () => { playBtn.textContent = '⏸'; cover.classList.add('playing'); });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; cover.classList.remove('playing'); });

    document.getElementById('next').addEventListener('click', () => {
      if (tracks.length === 0) return;
      currentIndex = (currentIndex + 1) % tracks.length;
      loadTrack(currentIndex); audio.play();
    });

    document.getElementById('prev').addEventListener('click', () => {
      if (tracks.length === 0) return;
      currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentIndex); audio.play();
    });

    audio.addEventListener('ended', () => document.getElementById('next').click());
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('current-time').textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('duration').textContent = formatTime(audio.duration);
    });
    document.getElementById('progress').addEventListener('input', (e) => {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    });

    // Загружаем популярные треки при старте
    fetchTracks();
  </script>
</body>
</html>
