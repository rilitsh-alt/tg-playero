<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Premium Player</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    /* Переменные для плавной смены цветов */
    :root {
      --theme-color: #1DB954; /* Цвет по умолчанию (Spotify Green) */
      --theme-color-glow: rgba(29, 185, 84, 0.4);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #121212 !important;
      background: linear-gradient(180deg, #1f1f1f 0%, #121212 100%) !important;
      color: #ffffff !important;
      min-height: 100vh; padding: 20px 16px; overflow-x: hidden;
      display: flex; justify-content: center;
      transition: background 0.8s ease;
    }
    
    .app { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 30px; }
    .header h1 { font-size: 24px; font-weight: 800; color: #ffffff; }
    .header p { font-size: 14px; color: #b3b3b3; margin-top: 6px; font-weight: 500; }

    /* Обложка с эффектом свечения, зависящим от трека */
    .cover {
      width: 100%; aspect-ratio: 1 / 1;
      background: linear-gradient(135deg, var(--theme-color) 0%, #111 100%);
      border-radius: 24px; display: flex; align-items: center; justify-content: center;
      font-size: 90px; 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px var(--theme-color-glow);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.8s ease, box-shadow 0.8s ease; 
      user-select: none;
    }
    .cover.playing { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 
      0%, 100% { transform: scale(1); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 60px var(--theme-color-glow); } 
      50% { transform: scale(1.02); box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7), 0 0 80px var(--theme-color); } 
    }

    .track-info { text-align: center; margin-top: 8px; }
    .track-info h2 { font-size: 20px; font-weight: 700; margin-bottom: 6px; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .track-info p { font-size: 14px; color: #a7a7a7; font-weight: 500; }

    .player-panel {
      background: rgba(255, 255, 255, 0.06) !important; 
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 24px; padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; gap: 18px;
    }

    .progress-wrap { width: 100%; display: flex; flex-direction: column; gap: 8px; }
    .progress-wrap input[type="range"] {
      width: 100%; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.2);
      outline: none; cursor: pointer; accent-color: var(--theme-color); -webkit-appearance: none; appearance: none;
      transition: accent-color 0.8s;
    }
    .progress-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: #ffffff; cursor: pointer; box-shadow: 0 0 10px var(--theme-color-glow);
    }
    .time { display: flex; justify-content: space-between; font-size: 12px; color: #a7a7a7; font-weight: 500; }

    .controls { display: flex; justify-content: center; align-items: center; gap: 32px; margin-top: 4px; }
    .ctrl { background: none; border: none; color: #ffffff; font-size: 24px; cursor: pointer; transition: transform 0.2s, color 0.2s; display: flex; align-items: center; justify-content: center; }
    .ctrl:active { transform: scale(0.85); }
    .ctrl.play {
      width: 64px; height: 64px; border-radius: 50%; background: var(--theme-color); color: #000; font-size: 28px;
      box-shadow: 0 8px 24px var(--theme-color-glow); 
      transition: transform 0.2s, box-shadow 0.2s, background 0.8s, box-shadow 0.8s;
    }
    .ctrl.play:active { transform: scale(0.95); }

    .search-bar { width: 100%; position: relative; margin-bottom: 10px; }
    .search-bar input {
      width: 100%; padding: 12px 16px 12px 40px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255, 255, 255, 0.08); color: #ffffff; font-size: 15px; outline: none;
    }
    .search-bar input::placeholder { color: #888; }
    .search-bar::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.6;
    }

    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 10px 5px; border-radius: 12px; border: 1px solid transparent; background: rgba(255,255,255,0.06);
      color: #a7a7a7; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.3s; text-align: center;
    }
    .tab-btn.active { background: rgba(255, 255, 255, 0.1); color: var(--theme-color); border: 1px solid var(--theme-color); }

    .playlist h3 { font-size: 13px; font-weight: 700; color: #a7a7a7; margin-bottom: 12px; letter-spacing: 1px; text-transform: uppercase; padding-left: 4px; }
    .playlist ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
    
    .playlist li {
      padding: 14px 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent; cursor: pointer; font-size: 15px; font-weight: 500; color: #e5e5e5;
      transition: all 0.25s ease; display: flex; align-items: center; justify-content: space-between;
    }
    .playlist li .track-main { display: flex; align-items: center; gap: 12px; overflow: hidden; }
    .playlist li .track-main::before { content: "♪"; font-size: 16px; color: #a7a7a7; }
    .playlist li:active { transform: scale(0.98); }
    .playlist li.active { 
      background: rgba(255, 255, 255, 0.1); 
      border: 1px solid var(--theme-color); 
      color: var(--theme-color); 
      font-weight: 600; 
      box-shadow: 0 4px 15px var(--theme-color-glow);
    }
    .playlist li.active .track-main::before { content: "▶"; color: var(--theme-color); font-size: 14px; }

    .like-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 5px; opacity: 0.5; transition: transform 0.2s, opacity 0.2s; }
    .like-btn.liked { opacity: 1; transform: scale(1.1); }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>My Player</h1>
      <p id="user-name">Привет!</p>
    </header>

    <div class="cover" id="cover">🎶</div>

    <div class="track-info">
      <h2 id="track-title">Выбери трек</h2>
      <p id="track-artist">—</p>
    </div>

    <div class="player-panel">
      <div class="progress-wrap">
        <input type="range" id="progress" value="0" min="0" max="100" step="0.1" />
        <div class="time"><span id="current-time">0:00</span><span id="duration">0:00</span></div>
      </div>
      <div class="controls">
        <button id="prev" class="ctrl">⏮</button>
        <button id="play" class="ctrl play">▶</button>
        <button id="next" class="ctrl">⏭</button>
      </div>
    </div>

    <div>
      <div class="search-bar">
        <input type="text" id="search" placeholder="Поиск трека..." />
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-all">Все</button>
        <button class="tab-btn" id="tab-liked">❤️ Избранное</button>
        <button class="tab-btn" id="tab-recs">✨ Для вас</button>
      </div>
    </div>

    <div class="playlist">
      <ul id="playlist"></ul>
    </div>
  </div>

  <audio id="audio"></audio>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready(); tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) { document.getElementById('user-name').textContent = 'С возвращением, ' + user.first_name + '!'; }
    }

    // ДОБАВЛЕН ЦВЕТ (color) ДЛЯ КАЖДОГО ТРЕКА
    const tracks = [
      { id: 1, title: 'Blinding Lights', artist: 'The Weeknd', src: 'https://cdns-preview-c.dzcdn.net/stream/c-c9c2367e6d83d7825c67b9e24d2b873b-7.mp3', color: '#E32636' }, // Красный
      { id: 2, title: 'Save Your Tears', artist: 'The Weeknd', src: 'https://cdns-preview-e.dzcdn.net/stream/c-e345d0b4f2ad99c41cb47e2479719957-13.mp3', color: '#FF8C00' }, // Оранжевый
      { id: 3, title: 'Clocks', artist: 'Coldplay', src: 'https://cdns-preview-3.dzcdn.net/stream/c-3848b501c65e60103d923c5db4465243-12.mp3', color: '#1E90FF' }, // Синий
      { id: 4, title: 'Viva La Vida', artist: 'Coldplay', src: 'https://cdns-preview-9.dzcdn.net/stream/c-9f1a896e5184cbc85f60ac698b919c1a-15.mp3', color: '#FFD700' }, // Золотой
      { id: 5, title: 'Believer', artist: 'Imagine Dragons', src: 'https://cdns-preview-6.dzcdn.net/stream/c-6c4439f3e42c24a5c3d7e1f88c2b7b2a-7.mp3', color: '#8A2BE2' }, // Фиолетовый
      { id: 6, title: 'Thunder', artist: 'Imagine Dragons', src: 'https://cdns-preview-1.dzcdn.net/stream/c-1549878b919563d8f8dc7a1d6e244211-5.mp3', color: '#00CED1' } // Бирюзовый
    ];

    let likedTracks = JSON.parse(localStorage.getItem('likedTracks')) || [];
    let currentIndex = 0;
    let currentTab = 'all';
    let searchQuery = '';

    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('play');
    const cover = document.getElementById('cover');
    const playlistEl = document.getElementById('playlist');
    const searchInput = document.getElementById('search');
    
    const tabAll = document.getElementById('tab-all');
    const tabLiked = document.getElementById('tab-liked');
    const tabRecs = document.getElementById('tab-recs');

    function formatTime(sec) {
      if (isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60).toString().padStart(2, '0');
      return m + ':' + s;
    }

    // Функция смены цветовой темы (свечения)
    function updateTheme(color) {
      document.documentElement.style.setProperty('--theme-color', color);
      // Создаем прозрачную версию цвета для свечения (RGBA)
      const hex = color.replace('#', '');
      const r = parseInt(hex.substring(0, 2), 16);
      const g = parseInt(hex.substring(2, 4), 16);
      const b = parseInt(hex.substring(4, 6), 16);
      document.documentElement.style.setProperty('--theme-color-glow', `rgba(${r}, ${g}, ${b}, 0.4)`);
    }

    function loadTrack(index) {
      if (tracks.length === 0) return;
      currentIndex = index;
      const track = tracks[index];
      
      audio.src = track.src;
      document.getElementById('track-title').textContent = track.title;
      document.getElementById('track-artist').textContent = track.artist;
      
      // Меняем цвет при загрузке трека!
      updateTheme(track.color || '#1DB954'); 
      
      renderPlaylist();
    }

    function toggleLike(id, event) {
      event.stopPropagation();
      if (likedTracks.includes(id)) {
        likedTracks = likedTracks.filter(trackId => trackId !== id);
      } else {
        likedTracks.push(id);
      }
      localStorage.setItem('likedTracks', JSON.stringify(likedTracks));
      renderPlaylist();
    }

    function getRecommendations() {
      if (likedTracks.length === 0) {
        return [...tracks].sort(() => 0.5 - Math.random()).slice(0, 3);
      }
      const likedArtists = [...new Set(tracks.filter(t => likedTracks.includes(t.id)).map(t => t.artist))];
      let recommended = tracks.filter(t => likedArtists.includes(t.artist) && !likedTracks.includes(t.id));
      if (recommended.length < 3) {
        const others = tracks.filter(t => !likedArtists.includes(t.artist) && !likedTracks.includes(t.id)).sort(() => 0.5 - Math.random());
        recommended = recommended.concat(others);
      }
      return recommended.slice(0, 5);
    }

    function renderPlaylist() {
      playlistEl.innerHTML = '';
      let filteredTracks = tracks;
      
      if (currentTab === 'liked') {
        filteredTracks = tracks.filter(t => likedTracks.includes(t.id));
      } else if (currentTab === 'recs') {
        filteredTracks = getRecommendations();
      }

      if (searchQuery) {
        filteredTracks = filteredTracks.filter(t => t.title.toLowerCase().includes(searchQuery) || t.artist.toLowerCase().includes(searchQuery));
      }

      if (filteredTracks.length === 0) {
        playlistEl.innerHTML = '<li style="justify-content:center; color:#a7a7a7; background:none;">Ничего не найдено</li>';
        return;
      }

      filteredTracks.forEach((track) => {
        const li = document.createElement('li');
        const isActive = tracks[currentIndex]?.id === track.id;
        if (isActive) li.classList.add('active');

        const mainDiv = document.createElement('div');
        mainDiv.className = 'track-main';
        mainDiv.innerHTML = `<span>${track.title} — ${track.artist}</span>`;

        const likeBtn = document.createElement('button');
        likeBtn.className = 'like-btn ' + (likedTracks.includes(track.id) ? 'liked' : '');
        likeBtn.innerHTML = likedTracks.includes(track.id) ? '❤️' : '🤍';
        likeBtn.onclick = (e) => toggleLike(track.id, e);

        li.appendChild(mainDiv);
        li.appendChild(likeBtn);

        li.addEventListener('click', () => {
          const realIndex = tracks.findIndex(t => t.id === track.id);
          loadTrack(realIndex);
          audio.play();
        });

        playlistEl.appendChild(li);
      });
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.toLowerCase();
      renderPlaylist();
    });

    function switchTab(tabName) {
      currentTab = tabName;
      [tabAll, tabLiked, tabRecs].forEach(btn => btn.classList.remove('active'));
      if (tabName === 'all') tabAll.classList.add('active');
      if (tabName === 'liked') tabLiked.classList.add('active');
      if (tabName === 'recs') tabRecs.classList.add('active');
      renderPlaylist();
    }

    tabAll.addEventListener('click', () => switchTab('all'));
    tabLiked.addEventListener('click', () => switchTab('liked'));
    tabRecs.addEventListener('click', () => switchTab('recs'));

    playBtn.addEventListener('click', () => {
      if (audio.paused) audio.play(); else audio.pause();
    });

    audio.addEventListener('play', () => { playBtn.textContent = '⏸'; cover.classList.add('playing'); });
    audio.addEventListener('pause', () => { playBtn.textContent = '▶'; cover.classList.remove('playing'); });

    document.getElementById('next').addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % tracks.length;
      loadTrack(currentIndex); audio.play();
    });

    document.getElementById('prev').addEventListener('click', () => {
      currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
      loadTrack(currentIndex); audio.play();
    });

    audio.addEventListener('ended', () => document.getElementById('next').click());
    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;
      document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
      document.getElementById('current-time').textContent = formatTime(audio.currentTime);
    });
    audio.addEventListener('loadedmetadata', () => {
      document.getElementById('duration').textContent = formatTime(audio.duration);
    });
    document.getElementById('progress').addEventListener('input', (e) => {
      if (!audio.duration) return;
      audio.currentTime = (e.target.value / 100) * audio.duration;
    });

    if (tracks.length > 0) loadTrack(0);
  </script>
</body>
</html>
